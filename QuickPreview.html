<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HachiOrb · Grok Ball Pro</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 38%,#293342,#0e111a 66%);color:#e6e9ef;font:14px system-ui,Microsoft YaHei,sans-serif;display:grid;place-items:center;padding:28px}main{width:min(100%,640px);text-align:center}h1{font-size:19px;margin:0 0 6px}p{font-size:12px;color:#a6b2c4}#orb{width:min(75vw,350px);height:min(75vw,350px);margin:10px auto 18px;cursor:pointer}#orb svg{width:100%;height:100%;overflow:visible}.buttons{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin:10px 0 18px}button{border:1px solid #485469;color:#e6e9ef;border-radius:18px;background:#232d3b;padding:8px 12px;cursor:pointer}button[aria-pressed="true"]{background:#d4dde9;color:#0c1420}#status{min-height:22px;color:#a6b2c4}a{color:#b7d9f2}
</style></head><body><main>
<h1>HachiOrb · Grok Ball Pro</h1><p>原生 Pro SVG 引擎 · 球体和表情独立切换。透明桌面窗口及系统托盘需运行 Windows 版。</p>
<div id="orb" title="点击球体旋转"></div><div id="status">加载 Grok Ball Pro …</div>
<p>选择球体（9 款）</p><div id="body-list" class="buttons"></div>
<p>选择表情（示例；正式版支持 42 种）</p><div id="emotion-list" class="buttons"></div>
<p><a href="https://github.com/AshinTop/grok-ball-pro">Grok Ball Pro · MIT</a></p>
<script>
const urls=['https://cdn.jsdelivr.net/gh/AshinTop/grok-ball-pro@308db672da87402a2997a97306f4151eac2fcada/src/grok-ball.js','https://raw.githubusercontent.com/AshinTop/grok-ball-pro/308db672da87402a2997a97306f4151eac2fcada/src/grok-ball.js'];
const status=document.getElementById('status');
function load(src){return new Promise((ok,fail)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=fail;document.head.appendChild(s)})}
(async()=>{
 for(const src of urls){try{await load(src);if(window.GrokBall?.BODIES?.length===9)break}catch{}}
 if(!window.GrokBall?.BODIES || typeof window.GrokBall.create!=='function'){status.textContent='Pro 引擎加载失败，请联网或运行 Windows 启动脚本';return;}
 const engine=GrokBall.create('#orb',{body:'classic',emotion:'02'});
 function controls(target,options,onSelect){const el=document.getElementById(target);for(const [id,name] of options){const b=document.createElement('button');b.textContent=name;b.setAttribute('aria-pressed',id===options[0][0]?'true':'false');b.onclick=()=>{onSelect(id);el.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true')};el.append(b)}}
 controls('body-list',GrokBall.BODIES.map(b=>[b.id,b.name]),id=>{engine.setBody(id);status.textContent='球体：'+GrokBall.BODIES.find(b=>b.id===id).name});
 controls('emotion-list',[['02','待机'],['10','开心'],['22','星光眼'],['25','心动'],['30','思考'],['32','工作'],['33','完成'],['47','笑出眼泪']],id=>engine.setEmotion(id));
 document.getElementById('orb').addEventListener('click',()=>engine.spin(1));
 window.addEventListener('pointermove',e=>{const r=document.getElementById('orb').getBoundingClientRect();engine.setGaze(Math.max(-1,Math.min(1,(e.clientX-r.left-r.width/2)/(r.width*.85))),Math.max(-1,Math.min(1,(e.clientY-r.top-r.height/2)/(r.height*.85))))});
 status.textContent='原版 Pro 动画已加载 · 9 款球体 · 42 种表情';
})();
</script></main></body></html>
