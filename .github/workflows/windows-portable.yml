name: Publish HachiOrb Windows Release

# Only manual dispatch. Do not burn Actions minutes on normal pushes.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (e.g. v1.4.0)'
        required: true
        default: 'v1.4.0'
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate release version
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if ($env:RELEASE_VERSION -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw 'Version must look like v1.4.0'
          }
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_VERSION -ne "v$packageVersion") {
            throw "Release tag $env:RELEASE_VERSION does not match package.json version $packageVersion"
          }
      - name: Fetch verified Grok Ball Pro engine
        run: node scripts/bootstrap.cjs
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: Package portable Windows application
        run: npm run pack:win
      - name: Create portable ZIP and checksum
        shell: pwsh
        run: |
          $exe = 'release/HachiOrb-win32-x64/HachiOrb.exe'
          if (-not (Test-Path $exe)) { throw 'Windows executable was not generated.' }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $zipName = "HachiOrb-$version-win32-x64.zip"
          Compress-Archive -Path 'release/HachiOrb-win32-x64/*' -DestinationPath $zipName -Force
          $hash = (Get-FileHash $zipName -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path "$zipName.sha256" -Value "$hash  $zipName" -Encoding ascii
      - name: Publish directly to GitHub Releases (no Actions artifact)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $version = $env:RELEASE_VERSION
          $versionNumber = $version.TrimStart('v')
          $zipName = "HachiOrb-$versionNumber-win32-x64.zip"
          $assets = @($zipName, "$zipName.sha256")
          gh release view $version --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $version $assets --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $version $assets --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "HachiOrb Desktop $version" --notes 'Windows x64 portable ZIP. Extract the entire archive and keep all files together before running HachiOrb.exe. Install Node.js 22+ to set up Codex, Cursor, and WorkBuddy hooks. The build is unsigned and marked pre-release pending clean-machine verification.' --prerelease
          }
          if ($LASTEXITCODE -ne 0) { throw 'Publishing to GitHub Release failed.' }

