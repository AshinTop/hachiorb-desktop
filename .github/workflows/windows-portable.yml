name: Publish HachiOrb Windows Release

# No push/PR triggers: releases are intentionally started by a repository maintainer.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (e.g. v1.1.0)'
        required: true
        default: 'v1.2.0'
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate release version
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if ($env:RELEASE_VERSION -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw 'Version must look like v1.1.0'
          }
      - name: Fetch verified original Grok Ball
        run: node scripts/bootstrap.cjs
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: Package portable Windows application
        run: npm run pack:win
      - name: Create portable ZIP and checksum
        shell: pwsh
        run: |
          $exe = 'release/HachiOrb-win32-x64/HachiOrb.exe'
          if (-not (Test-Path $exe)) { throw 'Windows executable was not generated.' }
          Compress-Archive -Path 'release/HachiOrb-win32-x64/*' -DestinationPath 'HachiOrb-Windows-Portable.zip' -Force
          $hash = (Get-FileHash 'HachiOrb-Windows-Portable.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path 'HachiOrb-Windows-Portable.zip.sha256' -Value "$hash  HachiOrb-Windows-Portable.zip" -Encoding ascii
      - name: Publish directly to GitHub Releases (no Actions artifact)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $version = $env:RELEASE_VERSION
          $assets = @('HachiOrb-Windows-Portable.zip', 'HachiOrb-Windows-Portable.zip.sha256')
          gh release view $version --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $version $assets --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $version $assets --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "HachiOrb Desktop $version" --notes 'Windows x64 portable ZIP. Extract the entire archive before running HachiOrb.exe. Unsigned personal build; review code and verify SHA-256 before use.' --prerelease
          }
          if ($LASTEXITCODE -ne 0) { throw 'Publishing to GitHub Release failed.' }
