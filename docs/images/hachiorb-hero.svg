<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">HachiOrb Desktop: Windows 桌面宠物与 AI Agent 状态联动</title>
  <desc id="desc">白色圆球桌宠悬浮在深蓝渐变背景中，旁边展示 Codex、Cursor 和 WorkBuddy 的状态事件示例。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#263b62"/>
    </linearGradient>
    <radialGradient id="orb" cx="35%" cy="28%" r="75%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.72" stop-color="#f8f7f2"/>
      <stop offset="1" stop-color="#d8d9dc"/>
    </radialGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="190%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#77e2cf"/>
      <stop offset="1" stop-color="#76a8ff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="520" rx="28" fill="url(#bg)"/>
  <circle cx="936" cy="268" r="226" fill="#5a8be0" opacity=".12"/>
  <circle cx="940" cy="395" r="150" fill="#000" opacity=".36" filter="url(#shadow)"/>
  <g font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif">
    <text x="72" y="92" fill="#9fb8e8" font-size="19" font-weight="700" letter-spacing="3">HACHIORB DESKTOP · WINDOWS X64</text>
    <text x="72" y="171" fill="#fff" font-size="46" font-weight="700">桌面宠物，也看得见</text>
    <text x="72" y="229" fill="#fff" font-size="46" font-weight="700">AI 工具正在做什么</text>
    <text x="74" y="278" fill="#c8d4e8" font-size="22">Codex · Cursor · WorkBuddy 状态联动</text>
    <g font-size="17" font-weight="600">
      <rect x="72" y="322" width="116" height="38" rx="19" fill="#344a70"/>
      <text x="130" y="347" fill="#fff" text-anchor="middle">Codex</text>
      <rect x="200" y="322" width="116" height="38" rx="19" fill="#344a70"/>
      <text x="258" y="347" fill="#fff" text-anchor="middle">Cursor</text>
      <rect x="328" y="322" width="148" height="38" rx="19" fill="#344a70"/>
      <text x="402" y="347" fill="#fff" text-anchor="middle">WorkBuddy</text>
    </g>
    <text x="74" y="421" fill="#9fb8e8" font-size="16">本机 Hook 事件 · localhost 通信 · 不读取提示词</text>
    <text x="74" y="478" fill="#8294b3" font-size="14">功能示意图；状态卡片用于说明事件类型，不是运行时截图。</text>
    <g transform="translate(822 26)">
      <circle cx="120" cy="266" r="148" fill="#8d9198" opacity=".23"/>
      <circle cx="120" cy="256" r="140" fill="url(#orb)" stroke="#fff" stroke-opacity=".7" stroke-width="3"/>
      <ellipse cx="78" cy="244" rx="16" ry="28" fill="#202126"/>
      <ellipse cx="162" cy="244" rx="16" ry="28" fill="#202126"/>
      <path d="M 57 157 C 92 125, 151 125, 183 157" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" opacity=".62"/>
    </g>
    <g font-size="15" font-weight="600">
      <rect x="942" y="75" width="220" height="54" rx="16" fill="#16243c" stroke="#86a9e4" stroke-opacity=".45"/>
      <circle cx="963" cy="102" r="6" fill="#77e2cf"/>
      <text x="980" y="108" fill="#fff">Codex · 执行中</text>
      <rect x="972" y="362" width="190" height="54" rx="16" fill="#16243c" stroke="#86a9e4" stroke-opacity=".45"/>
      <circle cx="993" cy="389" r="6" fill="#76a8ff"/>
      <text x="1010" y="395" fill="#fff">Cursor · 思考中</text>
    </g>
    <path d="M 789 225 C 748 196, 760 129, 823 117" fill="none" stroke="url(#accent)" stroke-width="3" stroke-dasharray="5 9" opacity=".75"/>
    <path d="M 1018 332 C 1072 335, 1100 353, 1110 366" fill="none" stroke="url(#accent)" stroke-width="3" stroke-dasharray="5 9" opacity=".75"/>
  </g>
</svg>
